name: CI Pipeline

on:
    push:
        branches:
            - main

    workflow_dispatch:
        inputs:
            service:
                description: Service to build
                required: true
                default: all
                type: choice
                options:
                    - all
                    - api
                    - worker
                    - frontend

            tag:
                description: Custom image tag
                required: false
                type: string

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: ubuntu-latest

        outputs:
            image_tag: ${{ steps.vars.outputs.image_tag }}
            services: ${{ steps.vars.outputs.services }}
            selected_service: ${{ steps.vars.outputs.selected_service }}

        steps:
            - name: Prepare variables
              id: vars
              shell: bash
              run: |
                  set -e

                  TAG="${{ github.event.inputs.tag }}"

                  if [ -z "$TAG" ]; then
                    TAG="${GITHUB_SHA::7}"
                  fi

                  echo "image_tag=$TAG" >> $GITHUB_OUTPUT

                  if [ "${{ github.event_name }}" = "push" ]; then
                    SERVICES='["api","worker","frontend"]'
                    SELECTED_SERVICE="all"
                  else
                    if [ "${{ github.event.inputs.service }}" = "all" ]; then
                      SERVICES='["api","worker","frontend"]'
                      SELECTED_SERVICE="all"
                    else
                      SERVICES='["${{ github.event.inputs.service }}"]'
                      SELECTED_SERVICE="${{ github.event.inputs.service }}"
                    fi
                  fi

                  echo "services=$SERVICES" >> $GITHUB_OUTPUT
                  echo "selected_service=$SELECTED_SERVICE" >> $GITHUB_OUTPUT

    build:
        needs: prepare
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                service: ${{ fromJson(needs.prepare.outputs.services) }}

        env:
            IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build image
              run: |
                  docker compose \
                    -f docker-compose.build.yml \
                    build ${{ matrix.service }}

            - name: Push image
              run: |
                  docker compose \
                    -f docker-compose.build.yml \
                    push ${{ matrix.service }}

    trigger-cd:
        needs:
            - prepare
            - build

        runs-on: ubuntu-latest

        steps:
            - name: Trigger CD repository
              uses: peter-evans/repository-dispatch@v3
              with:
                  token: ${{ secrets.PAT_TOKEN }}
                  repository: whatislavx/personal-finance-analyzer-infra
                  event-type: app_release
                  client-payload: >-
                      {
                        "service": "${{ needs.prepare.outputs.selected_service }}",
                        "tag": "${{ needs.prepare.outputs.image_tag }}"
                      }
