name: CI Pipeline

on:
    push:
        branches:
            - main

    workflow_dispatch:
        inputs:
            service:
                description: Service to build
                required: true
                default: all
                type: choice
                options:
                    - all
                    - api
                    - worker
                    - frontend

            tag:
                description: Image tag
                required: false
                type: string

env:
    IMAGE_TAG: ${{ github.event.inputs.tag || github.sha }}

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            IMAGE_TAG: ${{ github.event.inputs.tag || github.sha }}
            REGISTRY_URL: docker.io/${{ secrets.DOCKERHUB_USERNAME }}

        strategy:
            matrix:
                service: ${{ fromJson(
                    github.event_name == 'push'
                    && '["api","worker","frontend"]'
                    || github.event.inputs.service == 'all'
                    && '["api","worker","frontend"]'
                    || format('["{0}"]', github.event.inputs.service)
                    ) }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build image
              run: |
                  docker compose \
                    -f docker-compose.build.yml \
                    build ${{ matrix.service }}

            - name: Push image
              run: |
                  docker compose \
                    -f docker-compose.build.yml \
                    push ${{ matrix.service }}

    trigger-cd:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Trigger CD repository
              uses: peter-evans/repository-dispatch@v3
              with:
                  token: ${{ secrets.PAT_TOKEN }}
                  repository: whatislavx/finance-infra
                  event-type: app_release
                  client-payload: >-
                      {
                        "service": "${{ github.event.inputs.service || 'all' }}",
                        "tag": "${{ env.IMAGE_TAG }}"
                      }
